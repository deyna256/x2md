name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - if: matrix.python == '3.12'
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check
      - run: uv run --locked pytest
      - if: matrix.python == '3.12'
        run: |
          uv build
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --no-index --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -c 'from importlib.resources import files; assert files("x2md").joinpath("py.typed").is_file()'
