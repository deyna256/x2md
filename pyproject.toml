[project]
name = "x2md"
version = "0.1.0.dev0"
description = "Convert documents and ebooks to Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Typing :: Typed"]
dependencies = []

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --strict-config"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[dependency-groups]
test = ["pytest>=9.2.0"]
dev = [
    { include-group = "test" },
    "ruff>=0.17.6",
    "ty>=0.0.112",
]
